version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  - name: finance_monthly_revenue
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: Finance team (CFO)
      email: finance@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly revenue closing report (net revenue per month and country), sent to the CFO and used for accounting."

  - name: churn_prediction_model
    label: Churn prediction ML model
    type: ml
    maturity: medium
    owner:
      name: Karim Benali
      email: karim.benali@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Weekly scoring of each customer's risk of leaving, used by Marketing to target retention campaigns."